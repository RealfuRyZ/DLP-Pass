# 发布构建：推送任意 v 开头的标签（如 v2.4.1）即自动触发。
# 在 GitHub 官方 Windows runner 上构建 onedir 程序、NSIS 安装包与单文件绿色版，自动创建 Release。
name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-modern:
    name: Build DLP-Pass (Win10/11, PyQt6)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Build onedir app
        run: python packaging/build_exe.py

      - name: Smoke test (--selftest, bundled mappings)
        run: packaging/dist/DLP-Pass/DLP-Pass.exe --selftest

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $nsis = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $nsis) -and -not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          powershell -ExecutionPolicy Bypass -File packaging\build_installer.ps1

      - name: Build portable exe
        run: python packaging/build_exe.py --portable

      - name: Smoke test portable
        run: packaging/dist/DLP-Pass-Portable.exe --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: installer-modern
          path: packaging/dist/DLP-Pass-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: portable-modern
          path: packaging/dist/DLP-Pass-Portable.exe

  build-win7:
    name: Build DLP-Pass-Win7 (Win7 SP1+, Python 3.8 + PyQt5)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -r requirements-win7.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Build onedir app
        run: python packaging/build_exe_win7.py

      - name: Smoke test (--selftest, bundled mappings)
        run: packaging/dist/DLP-Pass-Win7/DLP-Pass-Win7.exe --selftest

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $nsis = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $nsis) -and -not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          powershell -ExecutionPolicy Bypass -File packaging\build_installer.ps1 -AppDir DLP-Pass-Win7 -AppExe DLP-Pass-Win7.exe

      - name: Build portable exe
        run: python packaging/build_exe_win7.py --portable

      - name: Smoke test portable
        run: packaging/dist/DLP-Pass-Win7-Portable.exe --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: installer-win7
          path: packaging/dist/DLP-Pass-Setup-*-Win7.exe

      - uses: actions/upload-artifact@v4
        with:
          name: portable-win7
          path: packaging/dist/DLP-Pass-Win7-Portable.exe

  release:
    name: Publish GitHub Release
    needs: [build-modern, build-win7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum DLP-Pass-Setup-*.exe DLP-Pass-Portable.exe DLP-Pass-Win7-Portable.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build release notes from CHANGELOG
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 发布说明 = CHANGELOG.md 中本版本段落 + 与历史版本一致的 Full Changelog 链接
          set -euo pipefail
          tag="${TAG#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v header="## ${tag} " '
              /^## / { in_section = (index($0, header) == 1) }
              in_section { print }
            ' CHANGELOG.md > section.md
          else
            : > section.md
          fi
          {
            if [ -s section.md ]; then
              cat section.md
            else
              echo "${TAG} 更新说明见提交历史。"
            fi
            printf '\n**Full Changelog**: https://github.com/%s/commits/%s\n' "$GH_REPO" "$TAG"
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 同名 Release 已存在时先删除（重复打标签场景），再创建
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" -y || true
          gh release create "$TAG" \
            artifacts/DLP-Pass-Setup-*.exe \
            artifacts/DLP-Pass-Portable.exe \
            artifacts/DLP-Pass-Win7-Portable.exe \
            artifacts/SHA256SUMS.txt \
            --notes-file release-notes.md \
            --title "DLP-Pass $TAG"
